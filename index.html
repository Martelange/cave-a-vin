<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b09" />
  
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ma Cave" />
  <title>Ma Cave à Vin</title>

  <!-- ═══ CONFIGURATION — À MODIFIER ═══════════════════════════════════════ -->
  <script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0b09;
      --bg2:      #141210;
      --bg3:      #1c1916;
      --border:   rgba(180,140,80,.18);
      --gold:     #c9a84c;
      --gold-dim: #8a6a28;
      --red:      #8b1c1c;
      --white:    #f0ebe2;
      --muted:    #7a6f5e;
      --radius:   8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'DM Mono', monospace; font-size: 13px; overflow: hidden; }

    /* ── Layout principal ─────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100%; }

    #header {
      padding: calc(12px + var(--safe-top)) 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); flex-shrink: 0; position: relative; z-index: 10;
    }

    #header h1 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; letter-spacing: 2px; }
    #header .sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    #add-btn {
      background: var(--gold); border: none; border-radius: 6px;
      color: #0d0b09; font-family: 'DM Mono', monospace; font-size: 11px;
      padding: 8px 14px; cursor: pointer; letter-spacing: .5px; flex-shrink: 0;
    }

    /* ── Navigation ────────────────────────────────────────── */
    #nav {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--bg); flex-shrink: 0; overflow-x: auto;
    }
    #nav button {
      padding: 11px 16px; background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px;
      cursor: pointer; white-space: nowrap; transition: all .2s;
    }
    #nav button.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── Contenu scrollable ─────────────────────────────────── */
    #content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(16px + var(--safe-bot)); }

    /* ── Filtres ────────────────────────────────────────────── */
    #filters { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    #filters input, #filters select {
      background: var(--bg3); border: 1px solid var(--border); color: var(--white);
      font-family: 'DM Mono', monospace; font-size: 11px; border-radius: 6px; padding: 7px 10px;
      outline: none; flex: 1; min-width: 0;
    }
    #filters input { flex: 2; }
    #filters select { flex: 1; }
    #filters input:focus, #filters select:focus { border-color: var(--gold); }

    #filters2 { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; padding: 10px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; }
    .filter-row { display: flex; align-items: center; gap: 10px; }
    .filter-label { color: var(--muted); font-size: 10px; letter-spacing: .5px; white-space: nowrap; min-width: 110px; }
    #price-filter { flex: 1; -webkit-appearance: none; height: 3px; background: var(--bg2); border-radius: 2px; outline: none; cursor: pointer; }
    #price-filter::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); cursor: pointer; }
    #price-val { color: var(--gold); }
    .sort-btns { display: flex; gap: 5px; }
    .sort-btn { padding: 4px 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 9px; cursor: pointer; transition: all .2s; }
    .sort-btn.active { background: var(--gold)22; border-color: var(--gold); color: var(--gold); }

    /* Badge urgence */
    .urgency-bar { height: 3px; border-radius: 2px; margin-top: 6px; }

    /* ── Grille vins ─────────────────────────────────────────── */
    #wine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

    .wine-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px; cursor: pointer; position: relative; overflow: hidden;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      animation: fadeIn .3s ease both;
    }
    .wine-card:active { transform: scale(.97); }
    .wine-card .accent { position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .wine-card .emoji { font-size: 24px; margin-bottom: 8px; line-height: 1; }
    .wine-card .name { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
    .wine-card .meta { color: var(--muted); font-size: 10px; margin-bottom: 8px; }
    .wine-card .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .wine-card .price-row { display: flex; justify-content: space-between; align-items: center; }
    .wine-card .price { color: var(--gold); font-size: 11px; }
    .wine-card .qty { color: var(--muted); font-size: 10px; }
    .wine-card .details { color: var(--muted); font-size: 9px; margin: 4px 0; line-height: 1.5; border-top: 1px solid var(--border); padding-top: 6px; }
    .wine-card .details span { color: var(--white); }

    /* ── Badges ──────────────────────────────────────────────── */
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 20px;
      font-size: 9px; letter-spacing: .8px; text-transform: uppercase;
    }

    /* ── Rating bar ──────────────────────────────────────────── */
    .rating-wrap { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .rating-track { flex: 1; height: 2px; background: var(--bg3); border-radius: 1px; overflow: hidden; }
    .rating-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 1px; }
    .rating-val { color: var(--gold); font-size: 10px; min-width: 22px; }

    /* ── Dashboard ───────────────────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .kpi { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .kpi .icon { font-size: 18px; margin-bottom: 6px; }
    .kpi .val { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--gold); }
    .kpi .lbl { color: var(--muted); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    .chart-block { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .chart-block .title { color: var(--muted); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .bar-row { margin-bottom: 8px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 3px; }
    .bar-label span:first-child { color: var(--white); }
    .bar-label span:last-child { color: var(--muted); }
    .bar-track { height: 3px; background: var(--bg2); border-radius: 2px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; transition: width .6s ease; }

    /* ── Cave visuelle ───────────────────────────────────────── */
    .cave-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    }
    .bottle-slot {
      aspect-ratio: 1/2.5;
      border-radius: 40% 40% 12% 12% / 20% 20% 8% 8%;
      transition: transform .2s;
      position: relative;
    }
    .bottle-slot:active { transform: scale(1.08); }
    .bottle-slot .glint {
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      width: 3px; height: 3px; background: rgba(255,255,255,.35); border-radius: 50%;
    }
    .cave-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; }
    .legend-dot { width: 8px; height: 16px; border-radius: 10px; }

    /* ── Sommelier ───────────────────────────────────────────── */
    .sommelier-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .sommelier-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 18px; margin-bottom: 4px; }
    .sommelier-box p { color: var(--muted); font-size: 11px; margin-bottom: 14px; }
    .sommelier-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .sommelier-row input {
      flex: 1; background: var(--bg2); border: 1px solid var(--border); color: var(--white);
      font-family: 'DM Mono', monospace; font-size: 12px; border-radius: 6px; padding: 9px 12px; outline: none;
    }
    .sommelier-row input:focus { border-color: var(--gold); }
    .sommelier-row button {
      background: var(--gold); border: none; border-radius: 6px; color: #0d0b09;
      font-family: 'DM Mono', monospace; font-size: 11px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
    }
    .suggestions { display: flex; flex-wrap: wrap; gap: 6px; }
    .suggestion-btn {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); font-family: 'DM Mono', monospace; font-size: 9px; padding: 4px 10px; cursor: pointer;
    }
    .advice-box { background: var(--bg3); border: 1px solid rgba(201,168,76,.3); border-radius: 8px; padding: 16px; animation: fadeIn .3s ease; }
    .advice-text { font-family: 'Cormorant Garamond', serif; font-size: 15px; line-height: 1.7; color: var(--white); }

    /* ── Modal ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(8px);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn .2s ease;
    }
    .modal {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      padding-bottom: var(--safe-bot);
    }
    .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); position: relative; }
    .modal-header .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 16px 16px 0 0; }
    .modal-close {
      position: absolute; top: 14px; right: 16px; background: none; border: 1px solid var(--border);
      color: var(--muted); width: 26px; height: 26px; border-radius: 4px; font-size: 14px; cursor: pointer;
    }
    .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

    .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { background: var(--bg3); border-radius: 6px; padding: 10px 12px; text-align: center; }
    .stat .val { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--gold); }
    .stat .lbl { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    .section-title { color: var(--muted); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }

    .pairings-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .pairing-tag { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 10px; }

    .action-row { display: flex; gap: 8px; }
    .btn-checkout { flex: 1; padding: 11px; background: var(--red); border: none; border-radius: 6px; color: #fff; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; }
    .btn-checkin { flex: 1; padding: 11px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--white); font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; }

    /* ── Modal ajout ─────────────────────────────────────────── */
    .add-modal .input-group { display: flex; flex-direction: column; gap: 6px; }
    .add-modal label { color: var(--muted); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
    .add-modal input, .add-modal textarea {
      background: var(--bg3); border: 1px solid var(--border); color: var(--white);
      font-family: 'DM Mono', monospace; font-size: 12px; border-radius: 6px; padding: 9px 12px; outline: none; width: 100%;
    }
    .add-modal input:focus, .add-modal textarea:focus { border-color: var(--gold); }
    .photo-zone {
      border: 2px dashed var(--border); border-radius: 8px; padding: 20px;
      text-align: center; cursor: pointer; background: var(--bg3); transition: border-color .2s;
    }
    .photo-zone:active { border-color: var(--gold); }
    .photo-zone .icon { font-size: 28px; margin-bottom: 6px; }
    .photo-zone .hint { color: var(--muted); font-size: 11px; }
    .photo-preview { max-height: 140px; border-radius: 4px; object-fit: contain; width: 100%; }

    .btn-analyze {
      padding: 12px; background: var(--gold); border: none; border-radius: 6px;
      color: #0d0b09; font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; width: 100%;
    }
    .btn-analyze:disabled { background: var(--bg3); color: var(--muted); cursor: default; }
    .btn-confirm { padding: 12px; background: var(--gold); border: none; border-radius: 6px; color: #0d0b09; font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; flex: 2; }
    .btn-back { padding: 12px; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; flex: 1; }

    .wine-preview { background: var(--bg3); border: 1px solid rgba(201,168,76,.3); border-radius: 8px; padding: 14px; }
    .wine-preview .name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; }
    .wine-preview .meta { color: var(--muted); font-size: 11px; margin: 3px 0 10px; }
    .wine-preview .notes-italic { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-style: italic; line-height: 1.5; }

    /* ── Peak timeline ───────────────────────────────────────── */
    .peak-wrap { }
    .peak-track { position: relative; height: 6px; background: var(--bg3); border-radius: 3px; }
    .peak-fill { position: absolute; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 3px; }
    .peak-now { position: absolute; top: -2px; width: 2px; height: 10px; background: #fff; border-radius: 1px; }
    .peak-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; margin-top: 4px; }

    /* ── États ───────────────────────────────────────────────── */
    .loading-state { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 20px; text-align: center; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
    .loading-state p { color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 16px; animation: shimmer 1.5s ease infinite; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-family: 'Cormorant Garamond', serif; font-size: 16px; }

    .sync-indicator { position: fixed; bottom: calc(16px + var(--safe-bot)); right: 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 10px; color: var(--muted); z-index: 50; display: flex; align-items: center; gap: 6px; animation: fadeIn .3s ease; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; }
    .sync-dot.ok { background: #3a9b5a; }
    .sync-dot.loading { background: var(--gold); animation: shimmer .8s ease infinite; }
    .sync-dot.err { background: #c0392b; }

    /* ── Animations ──────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* ── Chat ───────────────────────────────────────────────── */
    #tab-chat { display: flex; flex-direction: column; height: 100%; }
    #chat-messages { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }

    .chat-bubble { display: flex; gap: 10px; align-items: flex-end; animation: fadeIn .25s ease; }
    .chat-bubble.user { flex-direction: row-reverse; }

    .bubble-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .bubble-avatar.ai  { background: var(--gold-dim); }
    .bubble-avatar.usr { background: var(--bg3); border: 1px solid var(--border); }

    .bubble-content { max-width: 78%; display: flex; flex-direction: column; gap: 6px; }
    .chat-bubble.user .bubble-content { align-items: flex-end; }

    .bubble-text {
      padding: 10px 14px; border-radius: 16px; font-size: 12px; line-height: 1.6;
      font-family: 'DM Mono', monospace;
    }
    .bubble-text.ai  { background: var(--bg3); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--white); }
    .bubble-text.usr { background: var(--gold); color: #0d0b09; border-bottom-right-radius: 4px; }

    .bubble-img { max-width: 180px; border-radius: 10px; border: 1px solid var(--border); }

    .bubble-wine-card {
      background: var(--bg2); border: 1px solid rgba(201,168,76,.35); border-radius: 10px;
      padding: 12px 14px; font-size: 11px; min-width: 200px;
    }
    .bubble-wine-card .wc-name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .bubble-wine-card .wc-meta { color: var(--muted); margin-bottom: 8px; }
    .bubble-wine-card .wc-confirm { display: flex; gap: 6px; margin-top: 10px; }
    .bubble-wine-card .wc-confirm button { flex: 1; padding: 7px; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; border: none; }
    .bubble-wine-card .wc-confirm .btn-ok  { background: var(--gold); color: #0d0b09; }
    .bubble-wine-card .wc-confirm .btn-no  { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }

    .chat-typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
    .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: typingDot 1.2s ease infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes typingDot { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-4px);opacity:1} }

    /* Barre input chat — fixée en bas */
    #chat-input-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + var(--safe-bot));
      display: none; gap: 8px; align-items: flex-end; z-index: 50;
    }
    #chat-input-bar.visible { display: flex; }

    #chat-photo-btn {
      width: 38px; height: 38px; border-radius: 8px; background: var(--bg3);
      border: 1px solid var(--border); color: var(--muted); font-size: 16px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    #chat-mic-btn {
      width: 38px; height: 38px; border-radius: 8px; background: var(--bg3);
      border: 1px solid var(--border); color: var(--muted); font-size: 16px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
      transition: background .2s, color .2s;
    }
    #chat-mic-btn.recording { background: #8b1c1c; color: #fff; animation: shimmer .8s ease infinite; }

    #chat-text-input {
      flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--white);
      font-family: 'DM Mono', monospace; font-size: 12px; border-radius: 20px;
      padding: 9px 14px; outline: none; resize: none; min-height: 38px; max-height: 100px;
      line-height: 1.4;
    }
    #chat-text-input:focus { border-color: var(--gold); }

    #chat-send-btn {
      width: 38px; height: 38px; border-radius: 50%; background: var(--gold);
      border: none; color: #0d0b09; font-size: 16px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .chat-img-preview-wrap {
      position: relative; margin-bottom: 6px;
    }
    .chat-img-preview { height: 60px; border-radius: 8px; border: 1px solid var(--border); }
    .chat-img-remove {
      position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
      border-radius: 50%; background: var(--red); border: none; color: #fff;
      font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <div>
      <h1>✦ Ma Cave</h1>
      <div class="sub" id="header-sub">Chargement…</div>
    </div>

  </div>

  <!-- Navigation -->
  <div id="nav">
    <button class="active" onclick="switchTab('cave',this)">🍷 Cave</button>
    <button onclick="switchTab('dashboard',this)">📊 Stats</button>
    <button onclick="switchTab('etageres',this)">🗄 Étagères</button>
  </div>

  <!-- Contenu principal -->
  <div id="content">
    <!-- Vue Cave -->
    <div id="tab-cave">
      <div id="filters">
        <input type="search" id="search-input" placeholder="Rechercher…" oninput="renderCave()" />
        <select id="type-filter" onchange="renderCave()">
          <option value="">Tous types</option>
          <option>Rouge</option><option>Blanc</option><option>Rosé</option><option>Pétillant</option>
        </select>
        <select id="region-filter" onchange="renderCave()">
          <option value="">Toutes régions</option>
        </select>
      </div>
      <div id="filters2">
        <div class="filter-row">
          <span class="filter-label">Prix max : <span id="price-val">–</span></span>
          <input type="range" id="price-filter" min="0" max="500" value="500" step="5" oninput="updatePriceLabel();renderCave()" />
        </div>
        <div class="filter-row">
          <span class="filter-label">Trier par :</span>
          <div class="sort-btns">
            <button class="sort-btn active" id="sort-urgency" onclick="setSort('urgency',this)">⚠ Urgence</button>
            <button class="sort-btn" id="sort-price" onclick="setSort('price',this)">€ Prix</button>
            <button class="sort-btn" id="sort-rating" onclick="setSort('rating',this)">★ Note</button>
          </div>
        </div>
      </div>
      <div id="wine-grid"></div>
    </div>

    <!-- Dashboard -->
    <div id="tab-dashboard" style="display:none"></div>

    <!-- Étagères -->
    <div id="tab-etageres" style="display:none"></div>

  <!-- Indicateur sync -->
  <div id="sync-indicator" class="sync-indicator" style="display:none">
    <div class="sync-dot ok" id="sync-dot"></div>
    <span id="sync-text">Synchronisé</span>
  </div>
</div>

  <div style="display:flex;flex-direction:column;flex:1;gap:6px">
    <div id="chat-img-preview-wrap" class="chat-img-preview-wrap" style="display:none">
      <img id="chat-img-preview" class="chat-img-preview" />
      <button class="chat-img-remove" onclick="removeChatImage()">×</button>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <div id="chat-photo-btn" onclick="document.getElementById('chat-photo-input').click()" title="Envoyer une photo">📸</div>
      <input type="file" id="chat-photo-input" accept="image/*" capture="environment" style="display:none" onchange="handleChatPhoto(this)" />
      <div id="chat-mic-btn" onclick="toggleMic()" title="Dicter un message">🎤</div>
      <textarea id="chat-text-input" placeholder="Ajoute un vin, pose une question…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <button id="chat-send-btn" onclick="sendChatMessage()">↑</button>
    </div>
  </div>
</div>

<!-- Modal détail bouteille -->
<div id="wine-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal('wine-modal')">
  <div class="modal" id="wine-modal-content"></div>
</div>

<!-- Modal ajout bouteille -->
<div id="add-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal('add-modal')">
  <div class="modal add-modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600">Ajouter une bouteille</div>
      <div style="color:var(--muted);font-size:11px;margin-top:2px">Analyse IA · Photo + description</div>
      <button class="modal-close" onclick="closeModal('add-modal')">×</button>
    </div>
    <div class="modal-body" id="add-modal-body"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  ÉTAT GLOBAL
// ════════════════════════════════════════════════════════════════
let wines = [];
let currentTab = 'cave';
const FLAG = {"France":"🇫🇷","Italie":"🇮🇹","Espagne":"🇪🇸","Allemagne":"🇩🇪","Portugal":"🇵🇹","USA":"🇺🇸","Argentine":"🇦🇷","Chili":"🇨🇱","Australie":"🇦🇺"};
const TYPE_COLORS = {Rouge:"#c0392b",Blanc:"#d4a843",Rosé:"#e8829a",Pétillant:"#7ab8d4"};

// ════════════════════════════════════════════════════════════════
//  API — APPELS VERS GOOGLE APPS SCRIPT
// ════════════════════════════════════════════════════════════════
async function api(action, body = {}) {
  showSync('loading', 'Synchronisation…');
  try {
    const url = SCRIPT_URL + '?action=' + action;
    const res = await fetch(url, {
      method: 'POST',
      body: JSON.stringify({ action, ...body }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    showSync('ok', 'Synchronisé');
    setTimeout(() => document.getElementById('sync-indicator').style.display = 'none', 2000);
    return data;
  } catch(e) {
    showSync('err', 'Erreur réseau');
    setTimeout(() => document.getElementById('sync-indicator').style.display = 'none', 3000);
    throw e;
  }
}

function showSync(state, text) {
  const el  = document.getElementById('sync-indicator');
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (!el || !dot || !txt) return; // éléments absents → ignorer
  el.style.display = 'flex';
  dot.className = 'sync-dot ' + state;
  txt.textContent = text;
}

// ════════════════════════════════════════════════════════════════
//  CHARGEMENT INITIAL
// ════════════════════════════════════════════════════════════════
async function loadWines() {
  document.getElementById('wine-grid').innerHTML = `
    <div class="loading-state" style="grid-column:1/-1">
      <div class="spinner"></div>
      <p>Chargement de la cave…</p>
    </div>`;
  try {
    const data = await api('list');
    wines = data.wines || [];
    updateHeader();
    populateRegions();
    initPriceSlider();
    renderCave();
  } catch(e) {
    document.getElementById('wine-grid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">⚠️</div>
        <p>Impossible de charger la cave.<br>Vérifiez l'URL du script.</p>
      </div>`;
  }
}

function updateHeader() {
  const total = wines.reduce((s,w) => s + (w.quantity||0), 0);
  document.getElementById('header-sub').textContent = `${total} bouteilles · ${wines.length} références`;
}

// ════════════════════════════════════════════════════════════════
//  NAVIGATION (remplacée par le chat ci-dessous)
// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════
//  VUE CAVE
// ════════════════════════════════════════════════════════════════
let currentSort = 'urgency';

function setSort(sort, btn) {
  currentSort = sort;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCave();
}

function updatePriceLabel() {
  const val = document.getElementById('price-filter').value;
  document.getElementById('price-val').textContent = val >= 500 ? '500€+' : val + '€';
}

function initPriceSlider() {
  if (!wines.length) return;
  const maxPrice = Math.max(...wines.map(w => w.price || 0));
  const rounded  = Math.ceil(maxPrice / 10) * 10; // arrondi à la dizaine sup
  const slider   = document.getElementById('price-filter');
  slider.max     = rounded;
  slider.value   = rounded;
  document.getElementById('price-val').textContent = rounded + '€';
}

function populateRegions() {
  const sel = document.getElementById('region-filter');
  const regions = [...new Set(wines.map(w => w.region).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Toutes régions</option>' + regions.map(r => `<option>${r}</option>`).join('');
}

function urgencyScore(w) {
  // Score d'urgence : plus c'est petit, plus c'est urgent
  const year = new Date().getFullYear();
  if (!w.peakTo) return 9999;
  const yearsLeft = w.peakTo - year;
  if (yearsLeft < 0) return -1; // passé = très urgent
  return yearsLeft;
}

function urgencyLabel(w) {
  const year = new Date().getFullYear();
  if (!w.peakTo) return { label: '?', color: '#555', barColor: '#555', barPct: 0 };
  const yearsLeft = w.peakTo - year;
  if (yearsLeft < 0)  return { label: 'Passé pic !', color: '#888', barColor: '#555', barPct: 100 };
  if (yearsLeft === 0) return { label: 'Dernière année !', color: '#e05555', barColor: '#e05555', barPct: 100 };
  if (yearsLeft <= 2)  return { label: `Boire avant ${w.peakTo}`, color: '#e0a030', barColor: '#e0a030', barPct: 85 };
  if (yearsLeft <= 5)  return { label: `Jusqu'en ${w.peakTo}`, color: '#c9a84c', barColor: '#c9a84c', barPct: 55 };
  const inPeak = year >= w.peakFrom;
  if (inPeak)          return { label: `À point · ${w.peakTo}`, color: '#3a9b5a', barColor: '#3a9b5a', barPct: 30 };
  return               { label: `Att. ${w.peakFrom}`, color: '#7ab8d4', barColor: '#7ab8d4', barPct: 10 };
}

function renderCave() {
  const q        = document.getElementById('search-input').value.toLowerCase();
  const type     = document.getElementById('type-filter').value;
  const region   = document.getElementById('region-filter').value;
  const priceMax = parseInt(document.getElementById('price-filter').value) || 500;
  const year     = new Date().getFullYear();

  let filtered = wines.filter(w => {
    const matchQ = !q || (w.name||'').toLowerCase().includes(q) || (w.region||'').toLowerCase().includes(q) || (w.grape||'').toLowerCase().includes(q);
    const matchT = !type   || w.type   === type;
    const matchR = !region || w.region === region;
    const matchP = (w.price||0) <= priceMax || priceMax >= 500;
    return matchQ && matchT && matchR && matchP;
  });

  // Tri
  if (currentSort === 'urgency') {
    filtered.sort((a, b) => urgencyScore(a) - urgencyScore(b));
  } else if (currentSort === 'price') {
    filtered.sort((a, b) => (b.price||0) - (a.price||0));
  } else if (currentSort === 'rating') {
    filtered.sort((a, b) => (b.rating||0) - (a.rating||0));
  }

  if (!filtered.length) {
    document.getElementById('wine-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔍</div><p>Aucun vin trouvé</p></div>`;
    return;
  }

  const typeColor = w => TYPE_COLORS[w.type] || '#888';
  const ratingPct = w => w.rating ? ((w.rating-80)/20*100) : 0;

  document.getElementById('wine-grid').innerHTML = filtered.map((w,i) => {
    const urg = urgencyLabel(w);
    const tc  = typeColor(w);
    return `
      <div class="wine-card" onclick="openWineModal(${w.id})" style="animation-delay:${i*0.04}s">
        <div class="accent" style="background:linear-gradient(90deg,${w.color||'#8b1c1c'},transparent)"></div>
        <div class="emoji">${w.img||'🍷'}</div>
        <div class="name">${w.name}</div>
        <div class="meta">${FLAG[w.country]||'🌍'} ${w.region}${w.year ? ' · '+w.year : ''}</div>
        <div class="badges">
          <span class="badge" style="border:1px solid ${tc}44;color:${tc};background:${tc}11">${w.type}</span>
        </div>
        <div class="details">
          ${w.producer ? `Prod. <span>${w.producer}</span><br>` : ''}
          ${w.domaine  ? `Dom. <span>${w.domaine}</span><br>`  : ''}
          ${w.grape    ? `<span>${w.grape}</span>` : ''}
        </div>
        <div class="price-row" style="margin-bottom:4px">
          <span class="price">${w.price||'?'}€</span>
          <span class="qty">× ${w.quantity||0} btl</span>
        </div>
        <div style="color:${urg.color};font-size:10px;margin-bottom:3px">${urg.label}</div>
        <div class="urgency-bar" style="background:var(--bg3)">
          <div style="height:100%;width:${urg.barPct}%;background:${urg.barColor};border-radius:2px;transition:width .6s ease"></div>
        </div>
        <div class="rating-wrap" style="margin-top:6px">
          <div class="rating-track"><div class="rating-fill" style="width:${ratingPct(w)}%"></div></div>
          <span class="rating-val">${w.rating||'–'}</span>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════
//  MODAL DÉTAIL BOUTEILLE
// ════════════════════════════════════════════════════════════════
function openWineModal(id) {
  const w = wines.find(x => String(x.id) === String(id));
  if (!w) return;
  const year = new Date().getFullYear();
  const inPeak = year >= w.peakFrom && year <= w.peakTo;
  const peakColor = inPeak ? '#3a9b5a' : '#e0a030';
  const peakLabel = inPeak ? 'À point maintenant' : `Fenêtre : ${w.peakFrom}–${w.peakTo}`;
  const typeColor = TYPE_COLORS[w.type] || '#888';

  // Timeline peak
  const pMin = 2015, pMax = 2045;
  const fillLeft = Math.max(0, Math.min(100, ((w.peakFrom-pMin)/(pMax-pMin))*100));
  const fillWidth = Math.max(2, ((w.peakTo-w.peakFrom)/(pMax-pMin))*100);
  const nowPct = ((year-pMin)/(pMax-pMin))*100;

  document.getElementById('wine-modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="accent-line" style="background:linear-gradient(90deg,${w.color||'#8b1c1c'},transparent)"></div>
      <div style="font-size:32px;margin-bottom:8px">${w.img||'🍷'}</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;line-height:1.2;padding-right:32px">${w.name}</div>
      <div style="color:var(--muted);font-size:11px;margin:4px 0 6px">${FLAG[w.country]||'🌍'} ${w.region}${w.year ? ' · '+w.year : ' · Sans millésime'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;font-size:10px">
        ${w.domaine   ? `<div style="color:var(--muted)">Domaine <span style="color:var(--white)">${w.domaine}</span></div>`   : ''}
        ${w.producer  ? `<div style="color:var(--muted)">Producteur <span style="color:var(--white)">${w.producer}</span></div>` : ''}
        ${w.grape     ? `<div style="color:var(--muted);grid-column:1/-1">Cépage <span style="color:var(--white)">${w.grape}</span></div>` : ''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="badge" style="border:1px solid ${typeColor}44;color:${typeColor};background:${typeColor}11">${w.type}</span>
        <span class="badge" style="border:1px solid ${peakColor}44;color:${peakColor};background:${peakColor}11">${peakLabel}</span>
      </div>
      <button class="modal-close" onclick="closeModal('wine-modal')">×</button>
    </div>
    <div class="modal-body">
      <div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><div class="val">${w.price||'?'}€</div><div class="lbl">Prix/btl</div></div>
        <div class="stat"><div class="val">${w.quantity||0}</div><div class="lbl">Bouteilles</div></div>
        <div class="stat"><div class="val">${((w.price||0)*(w.quantity||0)).toLocaleString()}€</div><div class="lbl">Valeur</div></div>
        <div class="stat"><div class="val">${w.rating||'–'}</div><div class="lbl">Note /100</div></div>
      </div>
      <div style="background:var(--bg3);border-radius:6px;padding:10px 14px;border:1px solid var(--border)">
        <div style="color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Urgence de consommation</div>
        <div style="color:${(()=>{const yr=new Date().getFullYear();const yl=(w.peakTo||yr)-yr;return yl<0?'#888':yl<=2?'#e05555':yl<=5?'#e0a030':'#3a9b5a'})()};font-size:12px;margin-bottom:4px">
          ${(()=>{const yr=new Date().getFullYear();const yl=(w.peakTo||9999)-yr;if(yl<0)return '⚠ Passé son pic de consommation';if(yl===0)return '🚨 Dernière année pour le consommer !';if(yl<=2)return '⏰ À boire dans les '+yl+' an'+(yl>1?'s':'');if(yl<=5)return '📅 Idéal jusqu\'en '+(w.peakTo);const inPeak=yr>=(w.peakFrom||0);return inPeak?'✓ À point maintenant, jusqu\'en '+(w.peakTo):'⏳ Attendre jusqu\'en '+(w.peakFrom)})()}
        </div>
        <div style="height:4px;background:var(--bg2);border-radius:2px">
          <div style="height:100%;border-radius:2px;background:${(()=>{const yr=new Date().getFullYear();const yl=(w.peakTo||9999)-yr;return yl<0?'#555':yl<=2?'#e05555':yl<=5?'#e0a030':'#3a9b5a'})()};width:${(()=>{const yr=new Date().getFullYear();const yl=(w.peakTo||9999)-yr;return yl<0?100:yl===0?100:yl<=2?80:yl<=5?50:20})()}%"></div>
        </div>
      </div>

      <div class="peak-wrap">
        <div class="section-title">Fenêtre de consommation</div>
        <div class="peak-track">
          <div class="peak-fill" style="left:${fillLeft}%;width:${fillWidth}%"></div>
          <div class="peak-now" style="left:${nowPct}%"></div>
        </div>
        <div class="peak-labels"><span>${pMin}</span><span style="color:var(--white)">◆ Aujourd'hui</span><span>${pMax}</span></div>
      </div>

      ${w.notes ? `
      <div>
        <div class="section-title">Notes de dégustation</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;line-height:1.6;color:var(--white)">${w.notes}</div>
      </div>` : ''}

      ${w.pairings && w.pairings.length ? `
      <div>
        <div class="section-title">Accords mets-vins</div>
        <div class="pairings-list">${w.pairings.map(p=>`<span class="pairing-tag">🍽 ${p}</span>`).join('')}</div>
      </div>` : ''}

      <div class="action-row">
        <button class="btn-checkout" onclick="checkoutWine(${w.id})">− Sortir une bouteille</button>
        <button class="btn-checkin"  onclick="checkinWine(${w.id})">+ Entrée stock</button>
      </div>
    </div>`;

  document.getElementById('wine-modal').style.display = 'flex';
}

async function checkoutWine(id) {
  const w = wines.find(x => String(x.id) === String(id));
  if (!w) return;
  try {
    const res = await api('checkout', { id, qty: 1 });
    if (res.deleted) {
      wines = wines.filter(x => String(x.id) !== String(id));
      closeModal('wine-modal');
    } else {
      w.quantity = res.newQuantity;
      openWineModal(id);
    }
    updateHeader();
    renderCave();
  } catch(e) { alert('Erreur : ' + e.message); }
}

async function checkinWine(id) {
  const w = wines.find(x => String(x.id) === String(id));
  if (!w) return;
  try {
    w.quantity = (w.quantity||0) + 1;
    await api('update', { id, wine: w });
    openWineModal(id);
    updateHeader();
    renderCave();
  } catch(e) { alert('Erreur : ' + e.message); }
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

// ════════════════════════════════════════════════════════════════
//  DASHBOARD
// ════════════════════════════════════════════════════════════════
function renderDashboard() {
  const total      = wines.reduce((s,w) => s + (w.quantity||0), 0);
  const totalValue = wines.reduce((s,w) => s + (w.price||0)*(w.quantity||0), 0);
  const avgRating  = wines.length ? Math.round(wines.reduce((s,w) => s+(w.rating||0),0)/wines.length) : 0;
  const year       = new Date().getFullYear();
  const inPeak     = wines.filter(w => year >= w.peakFrom && year <= w.peakTo).reduce((s,w)=>s+(w.quantity||0),0);

  const byCountry  = {};
  const byType     = {};
  wines.forEach(w => {
    byCountry[w.country] = (byCountry[w.country]||0)+(w.quantity||0);
    byType[w.type]       = (byType[w.type]||0)+(w.quantity||0);
  });

  const topWines = [...wines].sort((a,b)=>(b.price||0)*(b.quantity||0)-(a.price||0)*(a.quantity||0)).slice(0,5);

  const barRows = (data) => Object.entries(data).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
    <div class="bar-row">
      <div class="bar-label"><span>${FLAG[k]||''}${FLAG[k]?' ':''}${k}</span><span>${v}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/total*100).toFixed(1)}%"></div></div>
    </div>`).join('');

  document.getElementById('tab-dashboard').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="icon">🍷</div><div class="val">${total}</div><div class="lbl">Bouteilles</div></div>
      <div class="kpi"><div class="icon">💰</div><div class="val">${totalValue.toLocaleString()}€</div><div class="lbl">Valeur totale</div></div>
      <div class="kpi"><div class="icon">⭐</div><div class="val">${avgRating}/100</div><div class="lbl">Note moyenne</div></div>
      <div class="kpi"><div class="icon">✓</div><div class="val">${inPeak}</div><div class="lbl">À boire maintenant</div></div>
    </div>
    <div class="chart-block"><div class="title">Par pays</div>${barRows(byCountry)}</div>
    <div class="chart-block"><div class="title">Par type</div>${barRows(byType)}</div>
    <div class="chart-block">
      <div class="title">Top investissements</div>
      ${topWines.map(w => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:8px;align-items:center">
            <span style="font-size:14px">${w.img||'🍷'}</span>
            <div>
              <div style="font-size:11px">${w.name} <span style="color:var(--muted)">${w.year||'NM'}</span></div>
              <div style="font-size:9px;color:var(--muted)">${w.quantity} btl × ${w.price}€</div>
            </div>
          </div>

function renderEtageres() {
  const bottles = wines.flatMap(w => Array(w.quantity||0).fill(w));
  const totalSlots = Math.max(48, Math.ceil(bottles.length / 8) * 8);
  const slots = [...bottles, ...Array(totalSlots - bottles.length).fill(null)];

  const byType = {};
  wines.forEach(w => { byType[w.type] = (byType[w.type]||0)+(w.quantity||0); });

  document.getElementById('tab-etageres').innerHTML = `
    <div style="color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">
      ${bottles.length} bouteilles / ${totalSlots} emplacements
    </div>
    <div class="cave-grid">
      ${slots.map((w,i) => w
        ? `<div class="bottle-slot" title="${w.name} ${w.year||''}"
              style="background:linear-gradient(180deg,${w.color||'#8b1c1c'}dd,${w.color||'#8b1c1c'}88);border:1px solid ${w.color||'#8b1c1c'}66;animation:fadeIn .4s ease ${(i%8)*.05}s both">

        <div class="legend-item">

          <span style="color:var(--muted)">${type} <span style="color:var(--white)">${count}</span></span>

}

      </div>

        <button class="btn-confirm" onclick="confirmAdd()">✦ Ajouter à la cave</button>
      </div>`;
    return;
  }

  // Étape input
  body.innerHTML = `
    <div class="input-group">
      <label>Photo de l'étiquette (optionnel)</label>
      <div class="photo-zone" onclick="document.getElementById('photo-input').click()">

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  addState.imageMime = file.type;
  const reader = new FileReader();
  reader.onload = e => {
    addState.imagePreview = e.target.result;
    addState.imageB64 = e.target.result.split(',')[1];
    renderAddStep();
  };
  reader.readAsDataURL(file);
}

async function analyzeWine() {
  const desc = document.getElementById('desc-input')?.value || '';
  addState.description = desc;
  if (!addState.imageB64 && !desc.trim()) {
    const err = document.getElementById('add-error');
    err.textContent = 'Ajoutez une photo ou une description.';
    err.style.display = 'block';
    return;
  }
  addState.step = 'analyzing';
  renderAddStep();
  try {
    const res = await api('analyze', {
      description: addState.description,
      imageBase64: addState.imageB64,
      imageMimeType: addState.imageMime
    });
    addState.result = res.wine;
    addState.step = 'result';
    renderAddStep();
  } catch(e) {
    addState.step = 'input';
    renderAddStep();
    const err = document.getElementById('add-error');
    if (err) { err.textContent = 'Erreur d\'analyse. Réessayez.'; err.style.display = 'block'; }
  }
}

async function confirmAdd() {

async function sendChatMessage() {
  const input = document.getElementById('chat-text-input');
  const text = input.value.trim();
  if (!text && !chatImageB64) return;

  // Afficher la bulle user
  if (chatImageB64) appendImageBubble(document.getElementById('chat-img-preview').src);
  if (text) appendBubble('user', text);
  chatHistory.push({ role: 'user', text, hasImage: !!chatImageB64 });

  // Reset input
  input.value = '';
  input.style.height = 'auto';
  const imgB64 = chatImageB64;
  const imgMime = chatImageMime;
  removeChatImage();

  // Typing
  showTyping();

  try {
    const reply = await processChatMessage(text, imgB64, imgMime);
    removeTyping();
    if (reply.type === 'wine_preview') {
      showWinePreview(reply.wine, reply.message);
    } else if (reply.type === 'stock_update') {
      appendBubble('ai', reply.message);
      updateHeader();
      renderCave();
    } else {
      appendBubble('ai', reply.message);
    }
    chatHistory.push({ role: 'ai', text: reply.message });
  } catch(e) {
    removeTyping();
    appendBubble('ai', 'Désolé, une erreur est survenue. Réessayez.');
  }
}

async function processChatMessage(text, imgB64, imgMime) {
  const caveSummary = wines.map(w =>
    `ID:${w.id} | ${w.name} ${w.year||'NM'} | ${w.type} | ${w.region} | ${w.price}€ | stock:${w.quantity}`
  ).join('\n');

  const historyText = chatHistory.slice(-6).map(h => `${h.role==='user'?'User':'Assistant'}: ${h.text}`).join('\n');

  // Si image → analyse d'abord
  if (imgB64) {
    const res = await api('analyze', {
      description: text,
      imageBase64: imgB64,
      imageMimeType: imgMime || 'image/jpeg'
    });
    // Extraire la quantité du message
    const qtyMatch = text.match(/(\d+)\s*(bouteilles?|btl|flacons?)/i);
    if (qtyMatch) res.wine.quantity = parseInt(qtyMatch[1]);
    return { type: 'wine_preview', wine: res.wine, message: '' };
  }

  // Sinon → Claude décide quoi faire
  const payload = {
    model: 'claude-sonnet-4-5',
    max_tokens: 800,
    messages: [{ role: 'user', content:
      `Tu es l'assistant IA d'une cave à vin personnelle. Tu réponds TOUJOURS en JSON valide uniquement, sans backticks.

Cave actuelle:
${caveSummary}

Historique récent:
${historyText}

Message de l'utilisateur: "${text}"

Analyse l'intention et réponds en JSON avec ce format EXACT:
{
  "intent": "advice|stock_update|question|add_request",
  "message": "Ta réponse en français, HTML autorisé (br, strong)",
  "updates": []
}

Si intent="stock_update": updates = [{id: ID_du_vin, delta: -1}] (delta négatif = sortie, positif = entrée)
Si intent="advice": message = conseil sommelier enthousiaste en 3-5 phrases, cite les vins par nom
Si intent="question": réponds à la question sur la cave
Si intent="add_request": message = "J'ai besoin d'une photo de l'étiquette pour ajouter ce vin. Pouvez-vous en prendre une ?"

Règles strictes: JSON uniquement, message en français, pas de markdown.`
    }]
  };

  const chatApiRes = await api('chat', {
    messages: payload.messages,
    systemPrompt: payload.messages[0]?.content || ''
  });
  const raw = chatApiRes.reply || '{}';
  const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());

  if (parsed.intent === 'stock_update' && parsed.updates?.length) {
    for (const u of parsed.updates) {
      const wine = wines.find(w => String(w.id) === String(u.id));
      if (!wine) continue;
      const newQty = Math.max(0, (wine.quantity||0) + u.delta);
      if (newQty === 0) {
        await api('delete', { id: u.id });
        wines = wines.filter(w => String(w.id) !== String(u.id));
      } else {
        wine.quantity = newQty;
        await api('update', { id: u.id, wine });
      }
    }
    return { type: 'stock_update', message: parsed.message };
  }

  return { type: 'text', message: parsed.message };
}

// ── Dictée vocale ─────────────────────────────────────────────
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    appendBubble('ai', "La dictée vocale n'est pas disponible sur ce navigateur. Utilisez Chrome ou Safari.");
    return;
  }
  if (isRecording) {
    recognition?.stop();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('chat-mic-btn').classList.add('recording');
    document.getElementById('chat-mic-btn').textContent = '⏹';
  };
  recognition.onresult = e => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('chat-text-input').value = transcript;
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('chat-mic-btn').classList.remove('recording');
    document.getElementById('chat-mic-btn').textContent = '🎤';
    if (document.getElementById('chat-text-input').value.trim()) {
      setTimeout(() => sendChatMessage(), 300);
    }
  };
  recognition.onerror = () => {
    isRecording = false;
    document.getElementById('chat-mic-btn').classList.remove('recording');
    document.getElementById('chat-mic-btn').textContent = '🎤';
  };
  recognition.start();
}

  }

    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    background: var(--bg3);
  }
  #cw-header .avatar { font-size: 20px; }
  #cw-header .title { flex:1; }
  #cw-header .title div:first-child { font-family:'Cormorant Garamond',serif; font-size:15px; }
  #cw-header .title div:last-child  { color:var(--muted); font-size:9px; letter-spacing:1px; text-transform:uppercase; }
  #cw-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:2px 6px; }

  #cw-messages {
    flex:1; overflow-y:auto; padding:12px; display:flex;
    flex-direction:column; gap:10px; scroll-behavior:smooth;
  }
  #cw-messages::-webkit-scrollbar { width:3px; }
  #cw-messages::-webkit-scrollbar-thumb { background:var(--gold-dim); border-radius:2px; }

  .cw-msg { display:flex; gap:8px; animation: msgIn .2s ease both; }
  .cw-msg.user { flex-direction:row-reverse; }
  .cw-avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:2px; }
  .cw-avatar.bot  { background:var(--bg3); border:1px solid var(--border); }
  .cw-avatar.user { background:var(--gold-dim); }
  .cw-bubble {
    max-width: calc(100% - 60px); padding:8px 12px; border-radius:12px;
    font-size:12px; line-height:1.55;
  }
  .cw-msg.bot  .cw-bubble { background:var(--bg3); border:1px solid var(--border); border-radius:3px 12px 12px 12px; }
  .cw-msg.user .cw-bubble { background:rgba(201,168,76,.15); border:1px solid rgba(201,168,76,.2); border-radius:12px 3px 12px 12px; }
  .cw-typing span { width:5px;height:5px;background:var(--muted);border-radius:50%;display:inline-block;animation:typingDot 1.2s ease infinite; }
  .cw-typing span:nth-child(2){animation-delay:.2s} .cw-typing span:nth-child(3){animation-delay:.4s}

  #cw-input-area {
    border-top:1px solid var(--border); padding:10px 12px;
    display:flex; gap:8px; align-items:flex-end; background:var(--bg3); flex-shrink:0;
  }
  #cw-input {
    flex:1; background:var(--bg2); border:1px solid var(--border); color:var(--white);
    font-family:'DM Mono',monospace; font-size:12px; border-radius:16px;
    padding:7px 12px; outline:none; resize:none; max-height:80px; line-height:1.4;
  }
  #cw-input:focus { border-color:var(--gold); }
  #cw-send {
    width:34px; height:34px; border-radius:50%; background:var(--gold);
    border:none; color:#0d0b09; font-size:14px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #cw-send:disabled { background:var(--bg2); color:var(--muted); }
  #cw-photo-btn {
    width:34px; height:34px; border-radius:50%; background:var(--bg2);
    border:1px solid var(--border); color:var(--white); font-size:14px;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
</style>

<!-- FAB bouton -->
<button id="chat-fab" onclick="toggleChatWidget()" title="Sommelier IA">
  🍾
  <div class="badge" id="chat-badge"></div>
</button>

<!-- Widget chat -->
<div id="chat-widget">
  <div id="cw-header">
    <div class="avatar">🍾</div>
    <div class="title">
      <div>Sommelier IA</div>
      <div>Photo · Vocal · Texte</div>
    </div>
    <button id="cw-close" onclick="toggleChatWidget()">×</button>
  </div>
  <div id="cw-messages"></div>
  <div id="cw-input-area">
    <button id="cw-photo-btn" onclick="document.getElementById('cw-photo-input').click()" title="Photo">📸</button>
    <input type="file" id="cw-photo-input" accept="image/*" capture="environment" style="display:none" onchange="cwHandlePhoto(this)" />
    <textarea id="cw-input" rows="1" placeholder="Question ou photo d'étiquette…"
      oninput="cwResize(this);cwUpdateSend()"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();cwSend()}"></textarea>
    <button id="cw-send" onclick="cwSend()" disabled>↑</button>
  </div>
</div>

<script>
// ═══ WIDGET CHAT ══════════════════════════════════════════════
let cwOpen = false;
let cwHistory = [];
let cwPendingPhoto = null;
let cwInitialized = false;

function toggleChatWidget() {
  cwOpen = !cwOpen;
  const widget = document.getElementById('chat-widget');
  widget.classList.toggle('open', cwOpen);
  document.getElementById('chat-fab').innerHTML = cwOpen ? '×<div class="badge" id="chat-badge"></div>' : '🍾<div class="badge" id="chat-badge"></div>';
  document.getElementById('chat-fab').style.background = cwOpen ? 'var(--bg3)' : 'var(--gold)';
  document.getElementById('chat-fab').style.color = cwOpen ? 'var(--white)' : '#0d0b09';
  document.getElementById('chat-fab').style.border = cwOpen ? '1px solid var(--border)' : 'none';
  if (cwOpen && !cwInitialized) {
    cwInitialized = true;
    cwAddBot(`Bonjour ! Je peux vous aider à :<br>• <strong>Ajouter un vin</strong> — photo ou description<br>• <strong>Sortir une bouteille</strong> — dites-le moi<br>• <strong>Vous conseiller</strong> — dîner, occasion, budget`);
  }
  if (cwOpen) setTimeout(() => document.getElementById('cw-input').focus(), 100);
}

function cwResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

function cwUpdateSend() {
  const val = document.getElementById('cw-input').value.trim();
  document.getElementById('cw-send').disabled = !val && !cwPendingPhoto;
}

function cwScroll() {
  const el = document.getElementById('cw-messages');
  el.scrollTop = el.scrollHeight;
}

function cwAddBot(html, typing = false) {
  const msgs = document.getElementById('cw-messages');
  if (typing) {
    const d = document.createElement('div');
    d.className = 'cw-msg bot'; d.id = 'cw-typing';
    d.innerHTML = `<div class="cw-avatar bot">🍾</div><div class="cw-bubble"><div class="cw-typing"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(d);
  } else {
    const d = document.createElement('div');
    d.className = 'cw-msg bot';
    d.innerHTML = `<div class="cw-avatar bot">🍾</div><div class="cw-bubble">${html}</div>`;
    msgs.appendChild(d);
  }
  cwScroll();
}

function cwAddUser(text, imgSrc) {
  const msgs = document.getElementById('cw-messages');
  const d = document.createElement('div');
  d.className = 'cw-msg user';
  d.innerHTML = `<div class="cw-avatar user">👤</div><div class="cw-bubble">${imgSrc ? `<img src="${imgSrc}" style="max-height:80px;border-radius:6px;display:block;margin-bottom:4px" />` : ''}${text ? text : ''}</div>`;
  msgs.appendChild(d);
  cwScroll();
}

function cwRemoveTyping() { document.getElementById('cw-typing')?.remove(); }

function cwHandlePhoto(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    cwPendingPhoto = { b64: e.target.result.split(',')[1], mime: file.type, preview: e.target.result };
    document.getElementById('cw-photo-btn').style.background = 'var(--gold)44';
    document.getElementById('cw-photo-btn').style.borderColor = 'var(--gold)';
    cwUpdateSend();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

async function cwSend() {
  const input = document.getElementById('cw-input');
  const text  = input.value.trim();
  if (!text && !cwPendingPhoto) return;

  cwAddUser(text, cwPendingPhoto?.preview);
  input.value = ''; cwResize(input); cwUpdateSend();

  const photo = cwPendingPhoto;
  cwPendingPhoto = null;
  document.getElementById('cw-photo-btn').style.background = '';
  document.getElementById('cw-photo-btn').style.borderColor = '';

  cwHistory.push({ role: 'user', content: text || 'Voici une photo.' });
  cwAddBot('', true);

  try {
    await cwProcess(text, photo);
  } catch(e) {
    cwRemoveTyping();
    cwAddBot('Désolé, une erreur est survenue.');
  }
}

async function cwProcess(text, photo) {
  const caveSummary = wines.map(w =>
    `ID:${w.id}|${w.name} ${w.year||'NM'}|${w.type}|${w.region}|${w.price}€|stock:${w.quantity}|pic:${w.peakFrom}-${w.peakTo}`
  ).join('\n');

  const systemPrompt = `Tu es le sommelier personnel d'un amateur de vin. Tu gères sa cave.
CAVE: ${caveSummary || 'vide'}
ACTIONS: 
- Liste de vins → ACTION:ADD_BULK puis texte brut
- 1 vin texte → ACTION:ANALYZE  
- Sortir vin → ACTION:CHECKOUT:<id>:<qty>
- Conseil/question → réponds directement 3-5 phrases en français`;

  if (photo) {
    cwRemoveTyping();
    await cwAnalyze(photo, text);
    return;
  }

  const messages = cwHistory.slice(-6).filter(h => typeof h.content === 'string');
  const data = await api('chat', { messages, systemPrompt });
  const reply = data.reply || '';
  cwHistory.push({ role: 'assistant', content: reply });
  cwRemoveTyping();

  if (reply.startsWith('ACTION:ADD_BULK')) {
    cwAddBot('🍷 Analyse en cours…');
    const raw = reply.replace('ACTION:ADD_BULK','').trim();
    const res = await api('addBulkFromText', { text: raw });
    if (res.wines?.length) {
      res.wines.forEach(w => wines.push(w));
      updateHeader(); populateRegions(); renderCave();
      const summary = res.wines.map(w => `• <strong>${w.name}</strong> ${w.year||'NM'} — ${w.quantity} btl`).join('<br>');
      cwAddBot(`✦ <strong>${res.wines.length} vins ajoutés !</strong><br>${summary}`);
    } else {
      cwAddBot("Erreur lors de l'ajout. Réessayez avec une photo.");
    }
  } else if (reply.startsWith('ACTION:ANALYZE')) {
    cwAddBot("Envoyez une photo de l'étiquette pour que je puisse l'analyser.");
  } else if (reply.startsWith('ACTION:CHECKOUT:')) {
    const parts = reply.split(':');
    const id = parts[2], qty = parseInt(parts[3])||1;
    const res = await api('checkout', { id, qty });
    const w = wines.find(x => String(x.id)===String(id));
    if (res.deleted) { wines = wines.filter(x => String(x.id)!==String(id)); }
    else if (w) { w.quantity = res.newQuantity; }
    updateHeader(); renderCave();
    cwAddBot(reply.split('\n').slice(1).join('<br>') || `Bouteille sortie ! Stock restant : ${res.newQuantity ?? 0}`);
  } else {
    cwAddBot(reply.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>'));
  }
}

async function cwAnalyze(photo, description) {
  try {
    const res = await api('analyze', { description, imageBase64: photo.b64, imageMimeType: photo.mime });
    const w = res.wine;
    const tc = {Rouge:'#c0392b',Blanc:'#d4a843',Rosé:'#e8829a',Pétillant:'#7ab8d4'}[w.type]||'#888';
    const msgDiv = document.createElement('div');
    msgDiv.className = 'cw-msg bot';
    msgDiv.innerHTML = `
      <div class="cw-avatar bot">🍾</div>
      <div class="cw-bubble">
        <div style="font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600">${w.name}</div>
        <div style="color:var(--muted);font-size:10px;margin:2px 0 6px">${w.region}${w.year?' · '+w.year:''} · ${w.grape||''}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
          <span style="border:1px solid ${tc}44;color:${tc};background:${tc}11;padding:2px 7px;border-radius:20px;font-size:9px">${w.type}</span>
          <span style="border:1px solid var(--gold)44;color:var(--gold);background:var(--gold)11;padding:2px 7px;border-radius:20px;font-size:9px">${w.price||'?'}€</span>
        </div>
        <div style="font-style:italic;font-family:'Cormorant Garamond',serif;font-size:13px;margin-bottom:10px">${w.notes||''}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <div>
            <div style="color:var(--muted);font-size:9px;margin-bottom:3px">Quantité</div>
            <input type="number" id="cw-qty" value="${w.quantity||1}" min="1" max="99"
              style="width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--white);font-family:'DM Mono',monospace;font-size:12px;border-radius:4px;padding:4px 8px;outline:none;text-align:center" />
          </div>
          <div>
            <div style="color:var(--muted);font-size:9px;margin-bottom:3px">Format</div>
            <select id="cw-format" style="width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--white);font-family:'DM Mono',monospace;font-size:11px;border-radius:4px;padding:4px 6px;outline:none">
              <option value="Bouteille">Bouteille (75cl)</option>
              <option value="Magnum">Magnum (1,5L)</option>
              <option value="Jéroboam">Jéroboam (3L)</option>
              <option value="Réhoboam">Réhoboam (4,5L)</option>
              <option value="Mathusalem">Mathusalem (6L)</option>
              <option value="Salmanazar">Salmanazar (9L)</option>
              <option value="Balthazar">Balthazar (12L)</option>
              <option value="Nabuchodonosor">Nabuchodonosor (15L)</option>
              <option value="Demi">Demi (37,5cl)</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="this.closest('.cw-msg').remove();cwAddBot("Ajout annulé.")"
            style="flex:1;padding:7px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer">Annuler</button>
          <button onclick="cwConfirmAdd(${JSON.stringify(w).replace(/"/g,'&quot;')},this)"
            style="flex:2;padding:7px;background:var(--gold);border:none;border-radius:6px;color:#0d0b09;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer">✦ Ajouter</button>
        </div>
      </div>`;
    document.getElementById('cw-messages').appendChild(msgDiv);
    cwScroll();
  } catch(e) {
    cwAddBot("Je n'ai pas pu analyser ce vin. Ajoutez une description.");
  }
}

async function cwConfirmAdd(wine, btn) {
  const qty    = parseInt(document.getElementById('cw-qty')?.value)||1;
  const format = document.getElementById('cw-format')?.value || 'Bouteille';
  wine.quantity = qty;
  wine.format   = format;
  btn.disabled = true; btn.textContent = '…';
  try {
    // Vérifier si la référence existe déjà (même nom + même année + même format)
    const existing = wines.find(w =>
      w.name.toLowerCase().trim() === wine.name.toLowerCase().trim() &&
      String(w.year||'') === String(wine.year||'') &&
      (w.format||'Bouteille') === (wine.format||'Bouteille')
    );

    if (existing) {
      existing.quantity = (existing.quantity||0) + qty;
      await api('update', { id: existing.id, wine: existing });
      updateHeader(); renderCave();
      btn.closest('.cw-msg').remove();
      cwAddBot(`✦ <strong>${wine.name}</strong> déjà en cave — stock mis à jour : <strong>${existing.quantity} bouteilles</strong>`);
    } else {
      const res = await api('add', { wine });
      wine.id = res.id;
      wines.push(wine);
      updateHeader(); populateRegions(); renderCave();
      btn.closest('.cw-msg').remove();
      const fmtLabel = format !== 'Bouteille' ? ' en ' + format : '';
      cwAddBot('✦ <strong>' + wine.name + '</strong>' + fmtLabel + ' ajouté ! (' + qty + ' bouteille' + (qty>1?'s':'') + ')');
    }
  } catch(e) {
    btn.disabled = false; btn.textContent = '✦ Ajouter';
    cwAddBot("Erreur lors de l\'ajout.");
  }
}
</script>
